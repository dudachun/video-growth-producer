<svg width="1200" height="520" viewBox="0 0 1200 520" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Video Growth Producer">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="520" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#F8FAFC"/>
      <stop offset="0.52" stop-color="#EEF7FF"/>
      <stop offset="1" stop-color="#F8FFF9"/>
    </linearGradient>
    <linearGradient id="primary" x1="104" y1="108" x2="653" y2="390" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#2563EB"/>
      <stop offset="0.48" stop-color="#06B6D4"/>
      <stop offset="1" stop-color="#22C55E"/>
    </linearGradient>
    <linearGradient id="phone" x1="791" y1="75" x2="1057" y2="448" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#111827"/>
      <stop offset="1" stop-color="#0F766E"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="24" stdDeviation="22" flood-color="#0F172A" flood-opacity="0.15"/>
    </filter>
    <pattern id="grid" width="34" height="34" patternUnits="userSpaceOnUse">
      <path d="M 34 0 L 0 0 0 34" fill="none" stroke="#CBD5E1" stroke-width="1" opacity="0.35"/>
    </pattern>
    <style>
      .font { font-family: Inter, "Microsoft YaHei", "PingFang SC", "Noto Sans CJK SC", Arial, sans-serif; }
      .title { font-size: 64px; font-weight: 850; letter-spacing: 0; fill: #0F172A; }
      .subtitle { font-size: 30px; font-weight: 700; fill: #334155; }
      .body { font-size: 23px; font-weight: 600; fill: #475569; }
      .small { font-size: 18px; font-weight: 700; fill: #64748B; }
      .chip { font-size: 19px; font-weight: 800; fill: #0F172A; }
      .phoneText { font-size: 22px; font-weight: 850; fill: #F8FAFC; }
      .phoneSmall { font-size: 16px; font-weight: 700; fill: #BAE6FD; }
    </style>
  </defs>

  <rect width="1200" height="520" rx="36" fill="url(#bg)"/>
  <rect width="1200" height="520" rx="36" fill="url(#grid)"/>

  <circle cx="153" cy="103" r="72" fill="#DBEAFE" opacity="0.82"/>
  <circle cx="1115" cy="428" r="88" fill="#D1FAE5" opacity="0.72"/>
  <circle cx="689" cy="85" r="56" fill="#FEF3C7" opacity="0.75"/>

  <g class="font">
    <rect x="88" y="72" width="632" height="376" rx="30" fill="white" opacity="0.84" filter="url(#softShadow)"/>
    <rect x="112" y="98" width="150" height="38" rx="19" fill="#E0F2FE"/>
    <text x="134" y="124" class="small">Codex Skill</text>

    <text x="112" y="199" class="title">Video Growth</text>
    <text x="112" y="270" class="title">Producer</text>
    <text x="116" y="322" class="subtitle">可训练的短视频增长生产流</text>
    <text x="116" y="365" class="body">选题 → 文案 → 封面 → 配音 → Remotion 成片 → 数据复盘</text>

    <g transform="translate(116 398)">
      <rect width="118" height="38" rx="19" fill="#EFF6FF"/>
      <text x="22" y="26" class="chip">脚本</text>
      <rect x="132" width="118" height="38" rx="19" fill="#ECFEFF"/>
      <text x="154" y="26" class="chip">封面</text>
      <rect x="264" width="128" height="38" rx="19" fill="#F0FDF4"/>
      <text x="286" y="26" class="chip">字幕</text>
      <rect x="406" width="144" height="38" rx="19" fill="#FFFBEB"/>
      <text x="428" y="26" class="chip">数据记忆</text>
    </g>
  </g>

  <g filter="url(#softShadow)">
    <rect x="790" y="58" width="302" height="414" rx="42" fill="url(#phone)"/>
    <rect x="825" y="94" width="232" height="28" rx="14" fill="#1F2937"/>
    <circle cx="845" cy="108" r="5" fill="#38BDF8"/>
    <circle cx="864" cy="108" r="5" fill="#34D399"/>
    <circle cx="883" cy="108" r="5" fill="#FBBF24"/>

    <rect x="825" y="150" width="232" height="74" rx="20" fill="#F8FAFC" opacity="0.94"/>
    <text x="849" y="183" class="font" font-size="24" font-weight="850" fill="#0F172A">前 2 秒结果先行</text>
    <text x="849" y="210" class="font" font-size="16" font-weight="700" fill="#64748B">不要空背景，不要慢热</text>

    <rect x="825" y="244" width="232" height="74" rx="20" fill="#0EA5E9" opacity="0.95"/>
    <text x="849" y="277" class="font phoneText">字幕重点高亮</text>
    <text x="849" y="304" class="font phoneSmall">工具名 / 数字 / 结论词</text>

    <rect x="825" y="338" width="232" height="74" rx="20" fill="#22C55E" opacity="0.96"/>
    <text x="849" y="371" class="font phoneText">发布后复盘</text>
    <text x="849" y="398" class="font phoneSmall">把成功和失败写进记忆</text>
  </g>

  <path d="M713 255 C755 255 755 255 782 255" stroke="url(#primary)" stroke-width="7" stroke-linecap="round"/>
  <path d="M767 238 L786 255 L767 272" stroke="#0EA5E9" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
